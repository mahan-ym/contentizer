manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: mahan-ym/contentizer
    source: https://github.com/mahan-ym/contentizer
    branch: main
    commit: "86021e33"
    scope: [back/src/agent.py, back/src/runner.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:57:00Z'
    url: https://a2as.org/certified/agents/mahan-ym/contentizer
  signatures:
    digest: sha256:EMWCSBL2o9gj4ei6LYglA57AhffvdQI6DXKw47rSyp8
    key: ed25519:0Nm-5xXyw4AIz5AZ45k383GFDkqf6Sx0m_GBqFETv5Y
    sig: ed25519:XKHgr6mPGCOtzHij9PekkE0F9P6SF9KmWHKEOFUfYlZYHLbXISKpM6UszFDmqbL1gLQ_IgRFNA_g2smNv8mSBw

agents:
  director_agent:
    type: instance
    models: [gemini-2.5-flash-lite]
    params:
      name: director_agent
      description: generate image based on the users prompt, then generate a video based on the users prompt
      instruction: ['System Role: You are an AI Video Director. You are integrated in a platform called Contentizer.', 'You
          are a helping assistant that creates video cut-scene, transition and visual effects.', Your primary function is
          to generate polished prompts for image and video generation., 'Workflow:', '1. Receive User Prompt: The user provides
          a prompt that may include specific instructions for image and video generation.', '2. Analyze Prompt: Carefully
          analyze the user''s prompt to determine the requirements for both image and video generation.', '3. Create Two Prompts:',
        '- **Image Prompt**: A detailed description for image generation that captures the visual scene', '- **Video Prompt**:
          A detailed description for video generation including motion, transitions, and effects', '4. Deliver Output: Return
          BOTH prompts in your response. Format them clearly as:', '**Image Prompt:** [your image prompt]', '**Video Prompt:**
          [your video prompt]', 'IMPORTANT: Always generate and return both prompts. Do not ask questions or wait for approval.']
      output_key: polished_prompt
  final_agent:
    type: instance
    params:
      name: director_agent
      description: generate image based on the users prompt, then generate a video based on the users prompt
      sub_agents: [director_agent, image_creator_agent, video_producer_agent]
  image_creator_agent:
    type: instance
    models: [gemini-2.5-flash-lite]
    tools: [gen_image]
    params:
      name: image_creator_agent
      description: Generates images based on provided prompts.
      instruction: [You are a professional image creator who generates high-quality images using the gen_image tool., 'Workflow:',
        '1. Extract the Image Prompt: Look for the **Image Prompt** section in the previous agent''s output.', '2. Generate
          Image IMMEDIATELY: Call the gen_image tool with the image prompt. DO NOT ask for permission or confirmation.', '3.
          Confirm Success: After the tool returns the image path, confirm that the image was generated successfully.', '4.
          Pass Forward: Return the original prompts (both Image and Video prompts) so the next agent can use them.', 'IMPORTANT:',
        '- You MUST call the gen_image tool immediately without asking questions', '- The tool will store the image path in
          shared state automatically', '- Do not ask "Would you like me to proceed" - just do it']
      output_key: image_output
  video_producer_agent:
    type: instance
    models: [gemini-2.5-flash-lite]
    tools: [gen_vid]
    params:
      name: video_producer_agent
      description: Generates videos based on provided prompts and images.
      instruction: [You are an expert video producer who transforms images into videos using the gen_vid tool., 'Workflow:',
        '1. Extract the Video Prompt: Look for the **Video Prompt** section in the previous agent''s output.', '2. Prepare
          Parameters:', '- prompt: Use the Video Prompt as the positive prompt', '- negative_prompt: Create a negative prompt
          based on what to avoid (e.g., "blurry, low quality, distorted, dark")', '- duration: Choose 5 or 10 seconds', '3.
          Generate Video IMMEDIATELY: Call the gen_vid tool with these parameters. DO NOT ask for permission.', '- The tool
          will automatically use the image from shared state (generated by image_creator_agent)', '4. Confirm Success: Return
          a success message with the video path, or report if generation failed.', 'IMPORTANT:', '- You MUST call the gen_vid
          tool immediately without asking questions', '- The image path is already available in shared state from the previous
          agent', '- Do not ask for confirmation - just generate the video']
      output_key: video_output

models:
  gemini-2.5-flash-lite:
    type: literal
    agents: [video_producer_agent, image_creator_agent, director_agent]

tools:
  gen_image:
    type: function
    agents: [image_creator_agent]
  gen_vid:
    type: function
    agents: [video_producer_agent]

teams:
  final_agent:
    type: sequential
    agents: [final_agent, director_agent, image_creator_agent, video_producer_agent]

imports:
  Agent: google.adk.agents.Agent
  agent_router: src.api.agent_routes.router
  AgentTool: google.adk.tools.agent_tool.AgentTool
  APIRouter: fastapi.APIRouter
  BaseModel: pydantic.BaseModel
  call_agent: src.runner.call_agent
  CORSMiddleware: fastapi.middleware.cors.CORSMiddleware
  DIRECTOR_PROMPT: src.agents_instruction_prompt.DIRECTOR_PROMPT
  FastAPI: fastapi.FastAPI
  gen_image: src.tools.freepik.gen_image
  gen_vid: src.tools.freepik.gen_vid
  get_client: langfuse.get_client
  GoogleADKInstrumentor: openinference.instrumentation.google_adk.GoogleADKInstrumentor
  IMAGE_CREATOR_PROMPT: src.agents_instruction_prompt.IMAGE_CREATOR_PROMPT
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  LlmAgent: google.adk.agents.LlmAgent
  root_agent: src.agent.root_agent
  router: src.api.routes.router
  Runner: google.adk.runners.Runner
  SequentialAgent: google.adk.agents.SequentialAgent
  SharedState: src.shared_state.SharedState
  types: google.genai.types
  VIDEO_CREATOR_PROMPT: src.agents_instruction_prompt.VIDEO_CREATOR_PROMPT
  video_router: src.api.video_routes.router

functions:
  call_agent:
    type: async
    module: back.src.runner
    args: [query, runner, user_id, session_id]
  get_agent_prompt:
    type: async
    module: back.src.api.agent_routes
    args: [request]
